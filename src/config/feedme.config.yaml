# FeedMe user-facing configuration.
# Categories are ordered for the Chinese information workflow.

settings:
  defaultSource: 36kr
  maxItemsPerFeed: 20
  dataPath: ./public/data

summary:
  contentMaxChars: 4000
  temperature: 0.3
  maxTokens: 200
  unavailableMessages:
    zh: 无法生成摘要。
    en: Unable to generate summary.
  prompt: |
    你是专业的内容摘要专家。请使用 {{summaryLanguage}} 为文章生成简洁、准确、自然的摘要。
    要求：
    1. 抓住核心观点和关键信息
    2. 控制在100字以内
    3. 保持客观，不添加个人观点
    4. 如果内容为空或缺乏有用信息，不要编造细节

    Article title:
    {{title}}

    Article content:
    {{content}}

